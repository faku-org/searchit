name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  # Builds just the two backend sidecars (skips the full Rust/Tauri GUI
  # compile and the Vite frontend build -- neither is needed to test them)
  # and spawns them directly to exercise real endpoints, the same way
  # src-tauri/src/lib.rs does. Runs on `workflow_dispatch` (for fast, cheap
  # iteration) and on tag push, gating the actual release below.
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-14
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Build server sidecar
        run: bun scripts/bundle-server.mjs

      - name: Stage Bun runtime sidecar
        run: bun scripts/fetch-bun-sidecar.mjs

      - name: Build inference sidecar
        run: bun scripts/bundle-inference.mjs

      - name: Smoke-test both sidecars
        run: bun scripts/smoke-test-sidecars.mjs

  release:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # Apple Silicon only for now -- unsigned (no Apple Developer
          # account/notarization yet, see inference/README.md and AGENTS.md).
          # Users open it once via right-click > Open to get past Gatekeeper.
          - platform: macos-14
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Builds the inference sidecar (scripts/bundle-inference.mjs, run
      # automatically via tauri.conf.json's beforeBuildCommand).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SearchIt v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
