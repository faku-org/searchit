[project]
name = "searchit-inference"
version = "0.1.0"
description = "Local ML inference service for SearchIt (OCR, face recognition, CLIP embeddings)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pillow>=11.0",
  # Real on-device inference for faces + CLIP, everywhere, with no
  # torch/CUDA needed: insightface and the CLIP embedder both run on
  # onnxruntime (see config.get_execution_providers). This is always the
  # plain CPU-only wheel, even on a `directml`/`ml` sync below -- insightface
  # itself hard-depends on plain `onnxruntime` regardless of extras, and it
  # shares its import path with the GPU variants, so whichever's files
  # physically win on disk decides what actually runs. See the `directml`
  # extra's comment for the force-reinstall step that makes GPU actually win.
  "onnxruntime>=1.19",
  "insightface>=0.7",
  # CLIPImageProcessor/CLIPTokenizerFast only (pre/post-processing, not the
  # torch model itself -- see clip_embed.py, which loads the actual weights
  # as ONNX).
  "transformers>=4.46",
  "huggingface-hub>=0.26",
  # OS-native OCR (ocr_native.py) covers Windows/macOS for free; this is the
  # fallback ONNX OCR tier for everything else, bundled with its own small
  # model weights (no separate download).
  "rapidocr>=2.0",
  "winsdk>=1.0.0b0; sys_platform == 'win32'",
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Windows GPU acceleration (any DX12 GPU, not just NVIDIA). Installing this
# extra does NOT get you DirectML on its own -- `onnxruntime` above is a hard
# dependency of insightface too, so both wheels end up installed and
# whichever wins the shared `onnxruntime/` package directory decides what you
# actually run. Force-reinstalling this one last (after `uv sync --extra
# directml`) makes it win:
#
#   uv pip install --reinstall --no-deps onnxruntime-directml
#
# `scripts/bundle-inference.mjs` does this automatically for Windows sidecar
# builds; see inference/README.md for the manual dev-box version.
directml = ["onnxruntime-directml>=1.19"]

# Only needed on the machine that actually runs the higher-quality
# DeepSeek-OCR-2 tier (see ocr.py / app.py's _use_deepseek_ocr) -- an NVIDIA
# CUDA box. Not installed by default so `uv sync` stays fast for mock-mode
# development and the desktop client build never needs it.
ml = [
  # DeepSeek-OCR-2's model card validates against torch==2.6.0, but that
  # build predates Blackwell (sm_120, RTX 50-series) kernel support -- it
  # has no kernel image for this GPU at all. 2.9.1+ is the first stable
  # line with real sm_120 support; pulled from the cu128 index below rather
  # than PyPI's default build.
  "torch>=2.9.1",
  "torchvision>=0.24",
  "transformers==4.46.3",
  "tokenizers==0.20.3",
  "einops",
  "addict",
  "easydict",
  # Same import name/shared-directory caveat as the `directml` extra above --
  # this is the CUDA-accelerated one, for insightface + CLIP on this box.
  # Force-reinstall it last too if `onnxruntime`'s plain CPU wheel wins:
  # `uv pip install --reinstall --no-deps onnxruntime-gpu`.
  "onnxruntime-gpu>=1.19",
]

[tool.uv]
package = false
conflicts = [[{ extra = "directml" }, { extra = "ml" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
