# Optional: the server embeds PGlite by default (no external Postgres
# needed). This is only for the DATABASE_URL dev escape hatch -- set
# DATABASE_URL to point server/.env at this instead of the embedded database.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchit
      POSTGRES_PASSWORD: searchit
      POSTGRES_DB: searchit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
